name: Test

on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  test:
    runs-on: lux-build-amd64
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
    - run: yarn
    - run: yarn test:contracts
    - run: yarn test:client
